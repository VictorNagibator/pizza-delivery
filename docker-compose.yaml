services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    container_name: pizza-gateway
    ports:
      - "5000:5000"
    environment:
      RABBITMQ_HOST: rabbitmq
      MENU_RPC_QUEUE: menu_rpc
      ORDERS_RPC_QUEUE: orders_rpc
      HISTORY_RPC_QUEUE: history_rpc
    depends_on:
      rabbitmq:
        condition: service_healthy

  menu:
    build: ./menu
    container_name: pizza-menu
    environment:
      RABBITMQ_HOST: rabbitmq
      MENU_DB_PATH: /data/menu.db
      SEED_DATA: "1"
    volumes:
      - menu_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  orders:
    build: ./orders
    container_name: pizza-orders
    environment:
      RABBITMQ_HOST: rabbitmq
      ORDERS_DB_PATH: /data/orders.db
      MENU_RPC_QUEUE: menu_rpc
    volumes:
      - orders_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  history:
    build: ./history
    container_name: pizza-history
    environment:
      RABBITMQ_HOST: rabbitmq
      HISTORY_DB_PATH: /data/history.db
    volumes:
      - history_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  kitchen:
    build: ./kitchen
    container_name: pizza-kitchen
    environment:
      RABBITMQ_HOST: rabbitmq
      KITCHEN_DB_PATH: /data/kitchen.db
      SEED_DATA: "1"
    volumes:
      - kitchen_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  delivery:
    build: ./delivery
    container_name: pizza-delivery
    environment:
      RABBITMQ_HOST: rabbitmq
      DELIVERY_DB_PATH: /data/delivery.db
      SEED_DATA: "1"
    volumes:
      - delivery_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  menu_data:
  orders_data:
  history_data:
  kitchen_data:
  delivery_data:
